// Log信息
log on                                   //Creates a logfile (on | off)
sv_logecho 0                             //default 1; Echo log information to the console.
sv_logfile 1                             //default 1; Log server information in the log file.
sv_log_onefile 0                         //default 0; Log server information to only one file.
sv_logbans 1                             //default 0; Log server bans in the server logs.
sv_logflush 0                            //default 0; Flush the log files to disk on each write (slow).
sv_logsdir logs                          //Folder in the game directory where server logs will be stored.

// 服务器信息
hostname "Are you shooter?"
sv_allow_lobby_connect_only 0
rcon_password "You_are_shooter"

// Motd
motdfile mymotd.txt

// l4dtoolz
sv_steam_bypass 1

// 难度调整
sm_cvar z_difficulty "hard"
exec custom_diffculty_advanced.cfg

// 网络参数
sm_cvar fps_max 144
sm_cvar net_splitpacket_maxrate 32000
sm_cvar nb_update_frequency 0.024
sm_cvar tick_door_speed 1.3
sm_cvar sv_minrate 64000
sm_cvar sv_maxrate 64000
sm_cvar sv_mincmdrate 64
sm_cvar sv_maxcmdrate 64
sm_cvar sv_minupdaterate 64
sm_cvar sv_maxupdaterate 64
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 2

// 文件一致性检查
sv_consistency 0
